<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=375, initial-scale=1.0" />
    <title>Agil & Linda Wedding</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      @font-face {
        font-family: 'Optima';
        src: url('./fonts/Optima.ttf') format('ttf');
        font-weight: normal;
        font-style: normal;
      }

      body {
        font-family: 'Optima', sans-serif;
        background-color: #fefefe;
        margin: 0;
        padding: 0;
        max-width: 375px;
        margin: 0 auto;
      }

      .section {
        text-align: center;
      }

      .cover-image {
        width: 100%;
      }

      .title {
        font-weight: bold;
        font-size: 28px;
        color: #4a2f2f;
        margin-top: 16px;
      }

      .subtitle {
        font-size: 16px;
        font-style: italic;
        color: #7a5c5c;
      }

      .quote {
        font-size: 14px;
        color: #6c757d;
        margin: 20px 0;
      }

      .event-title {
        font-size: 22px;
        font-weight: bold;
        color: #4a2f2f;
        margin-top: 10px;
      }

      .event-section {
        text-align: left;
        padding: 10px 20px;
      }

      .event-section h6 {
        font-style: italic;
        color: #7a5c5c;
      }

      .event-section .date {
        font-weight: bold;
      }

      .map {
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #ccc;
        margin: 10px 0;
      }

      .map img {
        width: 100%;
      }

      .footer-image {
        width: 100%;
        margin-top: 20px;
      }

      .event-section {
        background-color: #fff;
      }

      .event-date {
        font-size: 14px;
        color: #3b2f2f;
        width: 50%;
      }

      .map-card {
        width: 130px;
        position: relative;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        border-radius: 10px;
        overflow: hidden;
      }

      .map-card img {
        width: 100%;
        border-radius: 10px;
      }

      .map-caption {
        position: absolute;
        bottom: 0;
        left: 0;
        font-size: 12px;
        background-color: rgba(59, 47, 47, 0.8);
        padding: 6px;
        width: 100%;
        text-align: center;
        border-bottom-left-radius: 10px;
        border-bottom-right-radius: 10px;
      }

      #music-control {
        z-index: 9999;
      }

      #play-btn {
        font-size: 18px;
        width: 40px;
        height: 40px;
        line-height: 1;
      }

      #music-toggle-btn {
        font-size: 20px;
        width: 50px;
        height: 50px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>

  <body>
    <div class="section">
      <!-- Background Music -->
      <audio id="bg-music" loop preload="auto">
        <source src="music/Payung Teduh - Akad.mp3" type="audio/mpeg" />
      </audio>

      <!-- Music Control Button -->
      <div id="music-btn-wrapper" class="position-fixed bottom-0 end-0 p-3">
        <button id="music-toggle-btn" class="btn btn-light shadow rounded-circle">🔊</button>
      </div>

      <img src="foto/First Page.png" alt="Couple" class="cover-image" />
      <p></p>
      <img src="foto/Second Page.png" alt="Couple 2" class="cover-image" />
      <p></p>
      <img src="foto/Group 7.png" alt="Couple 2" class="cover-image" />
      <p></p>
      <img src="foto/foto3.jpg" alt="Couple 2" class="cover-image" />
    </div>

    <!-- Akad Section -->
    <section class="event-section border-top py-4 px-3">
      <h5 class="fst-italic mb-3"><b>Akad</b></h5>
      <div class="d-flex justify-content-between align-items-start">
        <div class="event-date">
          <h6 class="mb-1 fw-medium">Minggu</h6>
          <h5 class="mb-1">20 April 2025</h5>
          <p class="mb-3">08.00 - selesai</p>
          <p class="mb-0">Kaliangkep II, Guntur, Kec. Bener, Kabupaten Purworejo, Jawa Tengah</p>
        </div>
        <a href="https://maps.app.goo.gl/z1kxvrW1QQpFAXuD8?g_st=iw" target="_blank" class="map-card text-decoration-none">
          <img src="foto/map.png" alt="Map Akad" class="img-fluid rounded" />
          <div class="map-caption text-white">Rumah Mempelai Wanita</div>
        </a>
      </div>
    </section>

    <!-- Resepsi Section -->
    <section class="event-section border-top py-4 px-3">
      <h5 class="fst-italic mb-3"><b>Resepsi</b></h5>
      <div class="d-flex justify-content-between align-items-start">
        <div class="event-date">
          <h6 class="mb-1 fw-medium">Minggu</h6>
          <h5 class="mb-1">20 April 2025</h5>
          <p class="mb-3">11.00 - selesai</p>
          <p class="mb-0">Kaliangkep II, Guntur, Kec. Bener, Kabupaten Purworejo, Jawa Tengah</p>
        </div>
        <a href="https://maps.app.goo.gl/z1kxvrW1QQpFAXuD8?g_st=iw" target="_blank" class="map-card text-decoration-none">
          <img src="foto/map.png" alt="Map Resepsi" class="img-fluid rounded" />
          <div class="map-caption text-white">Rumah Mempelai Wanita</div>
        </a>
      </div>
    </section>

    <div class="section mb-5">
      <img src="foto/Group 8.png" alt="Bicycle Photo" class="footer-image" />
    </div>
  </body>

  <script>
    const music = document.getElementById('bg-music');
    const toggleBtn = document.getElementById('music-toggle-btn');
    music.volume = 0.7;

    let isPlaying = false;

    function playMusic() {
      music
        .play()
        .then(() => {
          isPlaying = true;
          toggleBtn.innerText = '🔊';
        })
        .catch((err) => {
          console.warn('Play blocked:', err);
        });
    }

    function pauseMusic() {
      music.pause();
      isPlaying = false;
      toggleBtn.innerText = '🔈';
    }

    toggleBtn.addEventListener('click', () => {
      if (isPlaying) {
        pauseMusic();
      } else {
        playMusic();
      }
    });

    // Auto-play when user scrolls
    function tryPlayMusicOnScroll() {
      if (!isPlaying) {
        playMusic();
        window.removeEventListener('scroll', tryPlayMusicOnScroll);
      }
    }

    window.addEventListener('scroll', tryPlayMusicOnScroll, { once: true });
  </script>
</html>
